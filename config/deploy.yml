service: hassig_com
image: hhassig/hassig.com
servers:
  web:
    hosts:
      - 100.71.23.44
    env:
      DB_HOST: daily_games_score-db
      SOLID_QUEUE_IN_PUMA: "true"
deploy_timeout: 120
proxy:
  ssl: false
  host: dgs.hassig.com
  app_port: 3000
registry:
  username: hhassig
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DAILY_GAMES_SCORE_DATABASE_PASSWORD
    - TELEGRAM_API_KEY
    - KAMAL_REGISTRY_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    POSTGRES_USER: daily_games_score
    POSTGRES_DB: daily_games_score_production
    POSTGRES_HOST: daily_games_score-db
    POSTGRES_PORT: 5432
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
volumes:
  - "daily_games_score_storage:/rails/storage"
asset_path: /rails/public/assets
builder:
  arch: amd64
accessories:
  db:
    image: postgres:16
    host: 100.71.23.44
    port: 5436:5432
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: daily_games_score
        POSTGRES_DB: daily_games_score_production
    volumes:
      - /root/daily_games_score-db/data:/var/lib/postgresql/data
      - /root/daily_games_score-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d