service: daily_games_score
image: hhassig/daily_games_scores
servers:
  web:
    hosts:
      - 5.78.45.115
    env:
      DB_HOST: daily_games_score-db
      SOLID_QUEUE_IN_PUMA: "true"
proxy:
  ssl: true
  host: dgs.hassig.com
registry:
  username: hhassig
  password:
    - KAMAL_REGISTRY_PASSWORD
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DAILY_GAMES_SCORE_DATABASE_PASSWORD
    - TELEGRAM_API_KEY
    - RAILS_MASTER_KEY
    - KAMAL_REGISTRY_PASSWORD
    - POSTGRES_PASSWORD
    - DAILY_GAMES_SCORE_DATABASE_PASSWORD
    - TELEGRAM_API_KEY
    - POSTGRES_USER
    - POSTGRES_DB
    - POSTGRES_PORT
    - POSTGRES_PASSWORD
  clear:
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: 5.78.45.115
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
volumes:
  - "daily_games_score_storage:/rails/storage"
asset_path: /rails/public/assets
builder:
  arch: amd64
accessories:
  db:
    image: postgres:16
    host: 5.78.45.115
    port: 5436:5432
    env:
      POSTGRES_USER: daily_games_score
      POSTGRES_DB: daily_games_score_production
    volumes:
      - /root/daily_games_score-db/data:/var/lib/postgresql/data
      - /root/daily_games_score-db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
